    const nCibles = Math.round(total * 0.2);
    const items = shuffle(range(total).map(i => i < nCibles ? { s: cibles[i % cibles.length], c: true } : { s: pick(distr), c: false }));
    const limite = Math.round((total * 1.15 + 12) * (kid ? 1.5 : 1));
    await ctx.countdown();
    const modele = cibles.map(c => `<span class="stim sm ${kid ? 'emoji' : ''}" style="font-size:1.8rem">${rendu(c)}</span>`).join('');
    ctx.html(`<div class="target-bar">${cibles.length > 1 ? 'Modèles' : 'Modèle'} ${modele}</div><div class="grid-board" id="board"></div>`);
    const board = $('#board');
    const w = ctx.stage.clientWidth - 32, hgt = ctx.stage.clientHeight - 110;
    const cell = Math.max(30, Math.min(64, Math.floor(Math.min((w - (cols - 1) * 6) / cols, (hgt - (rows - 1) * 6) / rows))));
    board.style.gridTemplateColumns = `repeat(${cols},${cell}px)`; board.style.width = 'auto';
    board.style.setProperty('--fam', 'var(--fam-att)');
    board.innerHTML = items.map((it, i) => `<button type="button" class="cell" data-i="${i}" style="width:${cell}px;font-size:${Math.round(cell * 0.55)}px" aria-label="case ${i + 1}">${rendu(it.s)}</button>`).join('');
    ctx.buttons([{ id: 'fin', label: kid ? 'J’ai fini' : 'J’ai terminé', keys: ['Enter'] }]);
    const t0 = performance.now(); const marques = new Set(), rtMarque = {};
    const tick = () => { const r = Math.max(0, limite - (performance.now() - t0) / 1000); ctx.info(`${Math.ceil(r)} s`); ctx.progress((performance.now() - t0) / 1000 / limite); if (r > 0 && RUN.actif) later(250, tick); };
    tick();
    while (true) {
      const rest = limite * 1000 - (performance.now() - t0); if (rest <= 0) break;
      const r = await ctx.tap('.cell', { root: board, timeout: rest });
      if (r.timeout || r.choice === 'fin') break;
      const i = +r.el.dataset.i;
      if (marques.has(i)) { marques.delete(i); r.el.classList.remove('marked'); } else { marques.add(i); r.el.classList.add('marked'); rtMarque[i] = r.rt; }
    }
    const temps = (performance.now() - t0) / 1000;
    const hits = [...marques].filter(i => items[i].c).length, fa = marques.size - hits;
    const nomItem = s => L >= 8 ? `flèche ${'→↘↓↙←↖↑↗'[s / 45]}` : kid ? s : L <= 3 ? descForme(s, L === 1 && s === 'etoile' ? 'orange' : 'bleu') : `lettre ${s}`;
    const ou = i => `${nomItem(items[i].s)} (ligne ${Math.floor(i / cols) + 1}, colonne ${i % cols + 1})`, modeles = cibles.map(nomItem).join(' ou ');
    [...marques].forEach(i => ctx.essai(items[i].c ? { ok: true, stim: ou(i), attendu: 'toucher', donne: 'touché', rt: rtMarque[i], badge: false }
      : { ok: false, stim: ou(i), attendu: 'ne pas toucher', donne: 'touché', rt: rtMarque[i], pourquoi: `Pas pareil au modèle (${modeles}) : il ne fallait pas toucher`, badge: false }));
    items.forEach((it, i) => { if (it.c && !marques.has(i)) ctx.essai({ ok: false, stim: ou(i), attendu: 'toucher', donne: null, pourquoi: 'Pareil au modèle : il fallait toucher cette case', badge: false }); });
    if (ctx.retour) { items.forEach((it, i) => { if (it.c && !marques.has(i)) { const b = board.children[i]; b.style.background = 'var(--warn-soft)'; } }); ctx.clearButtons(); await wait(1400); }
    const perf = clamp((hits - fa) / nCibles, 0, 1);
    return { perf, mesures: { precision: round(hits / nCibles * 100), omissions: nCibles - hits, commissions: fa, temps: round(temps, 1) }, details: { grille: `${cols}×${rows}`, cibles: nCibles, limite } };
  },
});

/* ---------------- Les flèches / poissons (flanker) ---------------- */
defEx({
  id: 'flanker', nom: 'Les flèches', nomEnfant: 'Les poissons', domaine: 'att-selective', paradigme: 'Tâche de flanker (Eriksen, ANT)',
  mesures: ['precision', 'trMoyen', 'coutInterference', 'erreurs'], principal: 'coutInterference', seuils: [0.8, 0.93], duree: '2 à 3 min',
  icone: ic('<path d="M3 12h4M10 12h4M17 12h4M19 9l2 3-2 3"/>'),
  consigne: kid => kid
    ? 'Une rangée de poissons apparaît. Regarde <b>seulement le poisson du milieu</b> : de quel côté nage-t-il ? Appuie sur la flèche du même côté. Ne te laisse pas distraire par les autres poissons !'
    : 'Une rangée de flèches apparaît. Indiquez <b>la direction de la flèche centrale</b> uniquement, en ignorant les flèches qui l’entourent. Répondez vite et sans erreur.',
  demo: kid => `<span>${[1, 1, 0, 1, 1].map(d => poissonSVG(!!d, 44)).join('')}</span>`,
  async run(ctx) {
    const L = ctx.niveau, kid = ctx.kid;
    const n = 36 + 4 * Math.floor(L / 2);
    const pInc = 0.35 + 0.035 * (L - 1), pNeutre = L <= 3 ? 0.2 : 0;
    const timeout = Math.max(900, 3000 - 230 * (L - 1)) + (kid ? 600 : 0);
    const essais = range(n).map(() => { const r = Math.random(); const cond = r < pNeutre ? 'neutre' : (r < pNeutre + pInc ? 'incongruent' : 'congruent'); return { cond, dir: Math.random() < 0.5 ? 'g' : 'd', dy: L >= 5 ? pick([-1, 1]) : 0 }; });
    const unite = (d, neutre) => {
      if (kid) return neutre ? `<svg viewBox="0 0 100 60" width="52" height="31" aria-hidden="true"><circle cx="50" cy="30" r="14" fill="none" stroke="var(--st-bleu)" stroke-width="4"/></svg>` : poissonSVG(d === 'd', 52);
      return neutre ? `<svg viewBox="0 0 100 100" width="46" height="46" aria-hidden="true"><rect x="10" y="40" width="80" height="20" rx="4" fill="var(--st-bleu)"/></svg>` : formeSVG('fleche', 'bleu', { taille: 46, rot: d === 'd' ? 0 : 180, trait: false });
    };
    ctx.buttons([{ id: 'g', html: ICONS.up.replace('<svg', '<svg style="transform:rotate(-90deg)"') + ' Gauche', keys: ['ArrowLeft', 'f'] }, { id: 'd', html: 'Droite ' + ICONS.up.replace('<svg', '<svg style="transform:rotate(90deg)"'), keys: ['ArrowRight', 'j'] }]);
    await ctx.countdown();
    const res = [];
    for (let i = 0; i < n; i++) {
      const e = essais[i]; ctx.progress(i / n);
      ctx.html(`<div class="fix">+</div>`); await wait(randInt(400, 750));
      const autour = e.cond === 'neutre' ? null : (e.cond === 'congruent' ? e.dir : (e.dir === 'g' ? 'd' : 'g'));
      const row = [0, 1, 2, 3, 4].map(k => k === 2 ? unite(e.dir, false) : unite(autour, e.cond === 'neutre')).join('');
      ctx.html(`<div style="display:flex;gap:4px;align-items:center;transform:translateY(${e.dy * 60}px)">${row}</div>`);
      const r = await ctx.answer({ timeout });
      const ok = r.id === e.dir; res.push({ ...e, ok, rt: r.rt });
      const fl = d => (d === 'g' ? '←' : '→'), cote = d => (d === 'g' ? 'gauche' : 'droite'), voisin = e.cond === 'neutre' ? (kid ? '○' : '▬') : fl(autour);
      ctx.essai({ ok, stim: `${kid ? 'poissons' : 'flèches'} ${voisin} ${voisin} ${fl(e.dir)} ${voisin} ${voisin}${e.dy ? (e.dy < 0 ? ' (en haut)' : ' (en bas)') : ''}`,
        attendu: e.dir === 'g' ? 'Gauche' : 'Droite', donne: r.id == null ? null : r.id === 'g' ? 'Gauche' : 'Droite', rt: r.rt,
        pourquoi: ok ? null : r.id == null ? `Pas de réponse à temps : ${kid ? 'le poisson' : 'la flèche'} du milieu allait à ${cote(e.dir)}`
          : e.cond === 'incongruent' ? `${kid ? 'Les autres poissons ont piégé : celui' : 'Les flèches voisines ont piégé : celle'} du milieu allait à ${cote(e.dir)}`
          : `${kid ? 'Le poisson' : 'La flèche'} du milieu allait à ${cote(e.dir)}` });
      ctx.flash(ok, { son: !ok || kid });
      ctx.html('');
    }
    ctx.progress(1);
    const rtsOk = c => res.filter(t => t.ok && t.cond === c).map(t => t.rt);
    const acc = precision(res.filter(t => t.ok).length, n);
    const cout = rtsOk('incongruent').length && rtsOk('congruent').length ? round(median(rtsOk('incongruent')) - median(rtsOk('congruent'))) : null;
    return { perf: acc, mesures: { precision: round(acc * 100), trMoyen: round(mean(res.filter(t => t.ok).map(t => t.rt))), coutInterference: cout, erreurs: res.filter(t => !t.ok && t.cond === 'incongruent').length }, details: { n, timeout, pInc: round(pInc, 2) } };
  },
});

/* ---------------- Double vigilance (attention divisée) ---------------- */
defEx({
  id: 'double', nom: 'Double vigilance', domaine: 'att-divisee', paradigme: 'Double tâche visuelle / auditive',
  mesures: ['precisionVisuelle', 'precisionAuditive', 'omissions', 'commissions', 'trMoyen'], principal: 'precision', seuils: [0.65, 0.85], duree: '1 à 2 min 30',
  icone: ic('<rect x="2" y="6" width="9" height="12" rx="2"/><circle cx="17.5" cy="12" r="4"/><path d="M6.5 10l1.2 2.4 2.3.3-1.7 1.6.4 2.3-2.2-1.1"/>'),
  consigne: kid => kid
    ? 'Deux jeux en même temps ! À gauche, des formes changent : appuie sur <b>« Étoile »</b> quand tu vois une étoile. À droite, une lampe s’allume avec un son : appuie sur <b>« Orange »</b> quand elle devient orange (son aigu).'
    : 'Surveillez deux zones à la fois. À gauche, appuyez sur <b>« Étoile »</b> dès qu’une étoile apparaît. À droite, une lampe s’allume accompagnée d’un son : appuyez sur <b>« Orange »</b> quand elle est orange (son aigu). Ignorez les autres signaux.',
  demo: () => `<span>${formeSVG('etoile', 'bleu', { taille: 44 })}</span><span style="width:44px;height:44px;border-radius:50%;background:var(--st-orange);display:inline-block"></span>`,
  async run(ctx) {
    const L = ctx.niveau, kid = ctx.kid;
    const D = ((kid ? 50 : 60) + (L - 1) * 10) * 1000;
    const soaV = Math.max(950, 1700 - 80 * (L - 1)) + (kid ? 250 : 0);
    const flashL = Math.max(250, 420 - 18 * (L - 1));
    const W = Math.max(1000, 1600 - 60 * (L - 1)) + (kid ? 300 : 0);
    const distrV = L >= 5 ? ['rond', 'carre', 'croix', 'losange', 'hexagone'] : ['rond', 'carre', 'triangle'];
    const couleurNon = L >= 6 ? 'jaune' : 'bleu';
    const [fAigu, fGrave] = L >= 6 ? [980, 740] : [1200, 520];
    const evV = [], evL = [];
    for (let t = 800; t < D; t += soaV) evV.push({ t, c: Math.random() < 0.25, f: null });
    evV.forEach(e => e.f = e.c ? 'etoile' : pick(distrV));
    for (let t = 1500; t < D;) { evL.push({ t, c: Math.random() < 0.35 }); t += randInt(2600 - 120 * L, 4200 - 150 * L); }
    await ctx.countdown();
    ctx.html(`<div class="dual"><div class="zone"><small>Formes</small><div id="zv"></div></div><div class="zone"><small>Lampe ${ctx.son ? '& son' : ''}</small><div class="lamp" id="zl"></div></div></div>`);
    ctx.buttons([{ id: 'v', html: formeSVG('etoile', 'bleu', { taille: 28, trait: false }) + ' Étoile', keys: ['ArrowLeft', 'f'] }, { id: 'l', html: '<span style="width:22px;height:22px;border-radius:50%;background:var(--st-orange);display:inline-block"></span> Orange', keys: ['ArrowRight', 'j'] }]);
    const zv = $('#zv'), zl = $('#zl');
    const reps = []; const t0 = performance.now();
    const nomV = f => descForme(f, 'bleu'), coul = c => (c ? 'orange' : couleurNon === 'jaune' ? 'jaune' : 'bleue');
    const lampe = c => `lampe ${coul(c)}${ctx.son ? (c ? ' (son aigu)' : ' (son grave)') : ''}`;
    const rateCible = (e, badge = true) => { e.omis = true; const v = 'f' in e; ctx.essai({ ok: false, stim: v ? nomV(e.f) : lampe(true), attendu: v ? 'Étoile' : 'Orange', donne: null, rt: null, badge, pourquoi: v ? 'Étoile ratée : il fallait appuyer sur « Étoile »' : 'Lampe orange ratée : il fallait appuyer sur « Orange »' }); };
    const essaiDouble = (id, t, pris) => {
      const v = id === 'v', ev = v ? evV : evL, bouton = v ? 'Étoile' : 'Orange', dt = e => t - e.t, cible = v ? nomV('etoile') : lampe(true);
      if (pris) return { ok: true, stim: cible, attendu: bouton, donne: bouton, rt: pris.rt };
      const non = (stim, pourquoi, attendu = 'ne pas appuyer') => ({ ok: false, stim, attendu, donne: bouton, rt: null, pourquoi });
      const der = ev.filter(e => dt(e) >= 0 && dt(e) <= W).pop(), autre = (v ? evL : evV).find(e => e.c && !e.pris && dt(e) >= 100 && dt(e) <= W);
      if (ev.some(e => e.c && e.pris && dt(e) <= W)) return non(cible, 'Déjà répondu pour celle-ci : un seul appui suffit', 'un seul appui');
      if (ev.some(e => e.c && dt(e) >= 0 && dt(e) < 100)) return non(cible, 'Appui en moins de 0,1 s : trop rapide, ça ne compte pas', `${bouton}, après l’avoir vue`);
      if (autre) return non(v ? lampe(true) : nomV('etoile'), `Mauvais bouton : c’était ${v ? 'la lampe orange, bouton « Orange »' : 'l’étoile, bouton « Étoile »'}`, v ? 'Orange' : 'Étoile');
      if (ev.some(e => e.c && !e.pris && dt(e) > W && dt(e) <= 2 * W)) return non(cible, `Trop tard : ${v ? 'l’étoile' : 'la lampe orange'} était déjà passée`, `${bouton}, plus tôt`);
      if (der && !der.c) return non(v ? nomV(der.f) : lampe(false), v ? `${nomV(der.f).replace(/^./, m => m.toUpperCase())}, pas une étoile : il ne fallait pas appuyer` : `Lampe ${coul(false)}, pas orange : il fallait attendre`);
      return non(v ? 'aucune forme' : 'lampe éteinte', `Pas ${v ? 'd’étoile' : 'de lampe orange'} à ce moment : il ne fallait pas appuyer`);
    };
    const surRep = id => {
      const t = performance.now() - t0, ev = id === 'v' ? evV : evL;
      const cand = ev.filter(e => e.c && t - e.t >= 100 && t - e.t <= W && !e.pris);
      const ok = cand.length > 0; if (ok) { cand[cand.length - 1].pris = true; cand[cand.length - 1].rt = t - cand[cand.length - 1].t; }
      reps.push({ id, t, ok }); ctx.essai(essaiDouble(id, t, ok ? cand[cand.length - 1] : null)); ctx.flash(ok, { son: !ok });
    };
    const onDown = e => { const b = e.target.closest('[data-choice]'); if (b) { e.preventDefault(); surRep(b.dataset.choice); } };
    const onKey = e => { if (e.repeat) return; if (['ArrowLeft', 'f'].includes(e.key)) surRep('v'); else if (['ArrowRight', 'j'].includes(e.key)) surRep('l'); };
    ctx.resp.addEventListener('pointerdown', onDown); document.addEventListener('keydown', onKey);
    RUN.cleanups.add(() => { ctx.resp.removeEventListener('pointerdown', onDown); document.removeEventListener('keydown', onKey); });
    let iv = 0, il = 0;
    while (true) {
      const t = performance.now() - t0; if (t >= D) break;
      ctx.progress(t / D); ctx.info(Math.ceil((D - t) / 1000) + ' s');
      while (iv < evV.length && evV[iv].t <= t) { zv.innerHTML = formeSVG(evV[iv].f, 'bleu', { taille: 96 }); iv++; }
      if (iv > 0 && t - evV[iv - 1].t > soaV * 0.6) zv.innerHTML = '';
      while (il < evL.length && evL[il].t <= t) {
        const e = evL[il]; zl.style.background = `var(--st-${e.c ? 'orange' : couleurNon})`;
        if (ctx.son) Sound.tone(e.c ? fAigu : fGrave, 0.22, 'sine', 0.12);
        later(flashL, () => { zl.style.background = ''; }); il++;
      }
      for (const e of evV.concat(evL)) if (e.c && !e.pris && !e.omis && t - e.t > W) rateCible(e);
      await wait(30);
    }
    ctx.resp.removeEventListener('pointerdown', onDown); document.removeEventListener('keydown', onKey);
    evV.concat(evL).filter(e => e.c && !e.pris && !e.omis).sort((a, b) => a.t - b.t).forEach(e => rateCible(e, false));
    ctx.progress(1);
    const hrV = precision(evV.filter(e => e.c && e.pris).length, evV.filter(e => e.c).length);
    const hrL = precision(evL.filter(e => e.c && e.pris).length, evL.filter(e => e.c).length);
    const fa = reps.filter(r => !r.ok).length, nCibles = evV.filter(e => e.c).length + evL.filter(e => e.c).length;
    const omissions = nCibles - evV.filter(e => e.pris).length - evL.filter(e => e.pris).length;
    const rts = evV.concat(evL).filter(e => e.pris).map(e => e.rt);
    const perf = ((hrV + hrL) / 2) * (1 - 0.5 * Math.min(1, fa / Math.max(1, nCibles)));
    return { perf, mesures: { precision: round(perf * 100), precisionVisuelle: round(hrV * 100), precisionAuditive: round(hrL * 100), omissions, commissions: fa, trMoyen: round(mean(rts)) }, details: { duree: D / 1000, soaV, fenetre: W } };
  },
});

/* ============ Exercices — MÉMOIRE ============ */

/* escalier adaptatif commun aux tâches d'empan : 2 réussites de suite → +1, 2 échecs de suite → −1 */
async function tacheEmpan(ctx, { type, sens }) {
  const kid = ctx.kid, envers = sens === 'envers';
  let span = ctx.niveau + 1;
  const maxSpan = type === 'corsi' ? 9 : 10, nEssais = kid ? 10 : 12;
  let okSuite = 0, koSuite = 0, reussis = 0, empanMax = 0;
  const hist = [];
  const CORSI = [[18, 20], [48, 12], [80, 22], [30, 45], [62, 40], [88, 55], [14, 75], [45, 80], [74, 82]];
  const on = kid ? 950 : 800, off = kid ? 320 : 260;
  await ctx.countdown();
  for (let essai = 0; essai < nEssais; essai++) {
    ctx.progress(essai / nEssais); ctx.info(`Série de ${span}`);
    ctx.clearButtons();
    let seq;
    if (type === 'corsi') seq = span <= 9 ? sample(range(9), span) : range(span).map(() => randInt(0, 8));
    else { seq = []; while (seq.length < span) { const d = randInt(1, 9); const l = seq[seq.length - 1]; if (d === l || (seq.length >= 2 && d - l === l - seq[seq.length - 2] && Math.abs(d - l) === 1)) continue; seq.push(d); } }
    const attendu = envers ? seq.slice().reverse() : seq;
    if (type === 'corsi') {
      ctx.html(`<div class="corsi" id="corsi">${CORSI.map(([x, y], i) => `<button type="button" data-b="${i}" style="left:${x}%;top:${y}%" aria-label="bloc ${i + 1}"></button>`).join('')}</div><p class="hint" id="h">Observe…</p>`);
      const blocs = $$('#corsi button');
      await wait(700);
      for (const b of seq) { blocs[b].classList.add('on'); await wait(on); blocs[b].classList.remove('on'); await wait(off); }
      $('#h').textContent = envers ? 'À toi : touche les blocs en partant du dernier.' : 'À toi : touche les blocs dans le même ordre.';
      const tRep0 = performance.now();
      const rep = [];
      while (rep.length < attendu.length) {
        const r = await ctx.tap('#corsi button');
        if (!r.el) continue;
        const i = +r.el.dataset.b; rep.push(i); r.el.classList.add('tapped'); later(220, () => r.el.classList.remove('tapped'));
      }
      var ok = rep.every((v, k) => v === attendu[k]), repDonnee = rep, tRep = performance.now() - tRep0;
    } else {
      ctx.html(`<div class="stim" id="dig"></div><p class="hint" id="h">Écoute et regarde…</p>`);
      const dig = $('#dig');
      await wait(600);
      for (const d of seq) { dig.textContent = d; if (ctx.voix) Voice.say(String(d), { rate: 1.05 }).catch(() => { }); await wait(on); dig.textContent = ''; await wait(off); }
      ctx.html(`<div class="answer-box" id="ab" aria-live="polite"></div><div class="seq-dots" id="dots">${attendu.map(() => '<i></i>').join('')}</div><p class="hint">${envers ? 'Tape les chiffres <b>à l’envers</b>, du dernier au premier.' : 'Tape les chiffres dans le même ordre.'}</p>`);
      ctx.buttons([1, 2, 3, 4, 5, 6, 7, 8, 9].map(d => ({ id: String(d), label: String(d), keys: [String(d)] })).concat([{ id: 'del', label: '⌫', keys: ['Backspace'], aria: 'effacer' }]), { cls: 'keypad', noKeys: true });
      const tRep0 = performance.now();
      const rep = [];
      while (rep.length < attendu.length) {
        const r = await ctx.answer();
        if (r.id === 'del') rep.pop(); else rep.push(+r.id);
        $('#ab').textContent = rep.join(' '); $$('#dots i').forEach((el, k) => el.classList.toggle('on', k < rep.length));
      }
      var tRep = performance.now() - tRep0;
      await wait(200);
      var ok = rep.every((v, k) => v === attendu[k]), repDonnee = rep;
    }
    hist.push({ span, ok });
    {
      const f = s => (type === 'corsi' ? s.map(b => b + 1) : s).join(' – '), quoi = type === 'corsi' ? 'bloc' : 'chiffre';
      const k = repDonnee.findIndex((v, j) => v !== attendu[j]), memes = [...repDonnee].sort().join() === [...attendu].sort().join();
      ctx.essai({ ok, stim: (type === 'corsi' ? 'blocs ' : '') + f(seq), attendu: f(attendu), donne: f(repDonnee), rt: tRep, badge: false,
        pourquoi: ok ? null : envers && f(repDonnee) === f(seq) ? `${type === 'corsi' ? 'Touchés' : 'Tapés'} dans l’ordre de départ : il fallait commencer par le dernier`
          : memes ? `Les bons ${quoi}s, mais pas dans le bon ordre`
          : `Le ${k ? `${k + 1}e` : '1er'} ${quoi} était ${type === 'corsi' ? `le bloc ${attendu[k] + 1}, pas le bloc ${repDonnee[k] + 1}` : `${attendu[k]}, pas ${repDonnee[k]}`}` });
    }
    ctx.flash(ok);
    ctx.html(`<div class="stim md" style="color:var(--${ok ? 'ok' : 'muted'})">${ok ? (kid ? 'Bravo !' : 'Correct') : (kid ? 'Presque !' : 'Pas tout à fait')}</div>`);
    await wait(750);
    if (ok) { reussis++; empanMax = Math.max(empanMax, span); okSuite++; koSuite = 0; if (okSuite >= 2) { span = Math.min(maxSpan, span + 1); okSuite = 0; } }
    else { koSuite++; okSuite = 0; if (koSuite >= 2) { span = Math.max(2, span - 1); koSuite = 0; } }

  consigne: kid => kid ? 'Retourne les cartes deux par deux pour <b>retrouver les paires</b>. Essaie de te souvenir où se cachent les images pour faire le moins de coups possible !' : 'Retournez deux cartes à la fois pour <b>reconstituer toutes les paires</b> en un minimum de coups. Mémorisez l’emplacement des cartes déjà vues.',
  demo: () => `<span class="card" style="width:44px;display:inline-grid"></span><span class="card up" style="width:44px;display:inline-grid;font-size:1.6rem"><span class="emoji">🍋</span></span>`,
  async run(ctx) {

    const syms = sample(set, paires);
    const cartes = shuffle(syms.concat(syms));
    const n = cartes.length, cols = n <= 8 ? 4 : n <= 12 ? 4 : n <= 20 ? 5 : 6, rows = Math.ceil(n / cols);
    await ctx.countdown();
    ctx.html(`<div class="cards" id="cards"></div>`);

    const w = ctx.stage.clientWidth - 32, hgt = ctx.stage.clientHeight - 40;
    const cw = Math.floor(Math.min((w - (cols - 1) * 8) / cols, ((hgt - (rows - 1) * 8) / rows) * 0.75, 110));
    zone.style.gridTemplateColumns = `repeat(${cols},${cw}px)`; zone.style.width = 'auto';
    zone.innerHTML = cartes.map((s, i) => `<button type="button" class="card" data-i="${i}" style="width:${cw}px;font-size:${Math.round(cw * 0.5)}px" aria-label="carte ${i + 1}"></button>`).join('');
    const els = $$('#cards .card');
    const vues = new Set(); let trouvees = 0, coups = 0, erreurs = 0, errMem = 0; const t0 = performance.now();

      const ia = +a.el.dataset.i; a.el.classList.add('up'); a.el.innerHTML = `<span class="emoji">${cartes[ia]}</span>`;
      let b, ib;
      do { b = await ctx.tap('.card:not(.up):not(.gone)', { root: zone }); ib = +b.el.dataset.i; } while (ib === ia);
      b.el.classList.add('up'); b.el.innerHTML = `<span class="emoji">${cartes[ib]}</span>`;
      coups++; ctx.info(`${coups} coup${coups > 1 ? 's' : ''}`); ctx.progress(trouvees / paires);

/* ---------------- Rotation mentale ---------------- */
function polyomino(k) {
  const norm = cells => { const mx = Math.min(...cells.map(c => c[0])), my = Math.min(...cells.map(c => c[1])); return cells.map(([x, y]) => [x - mx, y - my]).sort((a, b) => a[0] - b[0] || a[1] - b[1]); };
  const key = cells => norm(cells).map(c => c.join(',')).join(';');
  const rot = cells => cells.map(([x, y]) => [y, -x]);
  const mir = cells => cells.map(([x, y]) => [-x, y]);
  for (let essai = 0; essai < 200; essai++) {
    const cells = [[0, 0]];
    while (cells.length < k) { const [x, y] = pick(cells); const [dx, dy] = pick([[1, 0], [-1, 0], [0, 1], [0, -1]]); const n = [x + dx, y + dy]; if (!cells.some(c => c[0] === n[0] && c[1] === n[1])) cells.push(n); }
    const rots = [cells]; for (let i = 0; i < 3; i++) rots.push(rot(rots[i]));
    const mk = key(mir(cells));
    if (!rots.some(r => key(r) === mk)) return norm(cells);
  }
  return [[0, 0], [1, 0], [2, 0], [2, 1]];
}
function polySVG(cells, { rot = 0, miroir = false, taille = 150, couleur = 'var(--fam-vit)' } = {}) {
  const u = 22, w = Math.max(...cells.map(c => c[0])) + 1, h = Math.max(...cells.map(c => c[1])) + 1;
  const cx = w * u / 2, cy = h * u / 2;
  return `<svg viewBox="-70 -70 140 140" width="${taille}" height="${taille}" aria-hidden="true"><g transform="rotate(${rot}) scale(${miroir ? -1 : 1},1) translate(${-cx},${-cy})">${cells.map(([x, y]) => `<rect x="${x * u}" y="${y * u}" width="${u}" height="${u}" rx="3" fill="${couleur}" stroke="var(--surface)" stroke-width="2"/>`).join('')}</g></svg>`;
}

  async run(ctx) {

      const copie = new Set(); let sel = -1, masque = false;
      const taille = Math.min(260, Math.floor(Math.min(ctx.stage.clientWidth - 40, (ctx.stage.clientHeight - 70) / (ctx.stage.clientWidth < 600 ? 2 : 1))));
      const dessiner = () => ctx.html(`<div class="copy-wrap"><figure>${masque ? `<div style="width:${taille}px;height:${taille}px;border:1px dashed var(--line-strong);border-radius:14px;display:grid;place-items:center;color:var(--muted)">Modèle masqué</div>` : svg(modele, { taille })}<figcaption>Modèle</figcaption></figure><figure>${svg(copie, { interactif: true, sel, taille })}<figcaption>Ta copie</figcaption></figure></div>`);

    const essais = shuffle(range(n).map(i => {

/* journal des essais : explication courte d'une erreur de calcul */
function pourquoiCalcul(q, a, saisie) {
  const v = +saisie, base = `${q} font ${a}`;
  if (saisie.length > 1 && saisie.split('').reverse().join('') === String(a)) return `${base} : les chiffres sont inversés`;
  const m = q.match(/^(\d+) ([+−×÷]) (\d+)$/);
  if (m) {
    const x = +m[1], op = m[2], y = +m[3];
    if (op === '−' && v === x + y) return `${base} : c’est une soustraction, pas une addition`;
    if (op === '+' && v === Math.abs(x - y)) return `${base} : c’est une addition, pas une soustraction`;
    if (op === '×' && v === x + y) return `${base} : c’est une multiplication, pas une addition`;
    if (op === '+' && (x % 10) + (y % 10) >= 10 && v === a - 10) return `${base} : n’oublie pas la retenue`;
    if (op === '−' && (x % 10) < (y % 10) && v === a + 10) return `${base} : pour faire ${x % 10} − ${y % 10}, il faut casser une dizaine`;
  }
  if (Math.abs(v - a) === 1) return `${base} : tu étais à 1 près`;
  return base;
}
function genCalcul(L) {
  const r = randInt;
  switch (L) {
    case 1: { const a = r(1, 5), b = r(1, 5); return [`${a} + ${b}`, a + b]; }
    case 2: { const a = r(1, 9), b = r(1, 10 - a); return [`${a} + ${b}`, a + b]; }
    case 3: { if (Math.random() < 0.5) { const a = r(2, 10), b = r(1, a - 1); return [`${a} − ${b}`, a - b]; } const a = r(11, 18), b = r(1, 9 - (a % 10)); return [`${a} + ${b}`, a + b]; }
    case 4: { if (Math.random() < 0.5) { const a = r(3, 9), b = r(10 - a, 9); return [`${a} + ${b}`, a + b]; } const a = r(11, 19), b = r((a % 10) + 1, 9); return [`${a} − ${b}`, a - b]; }
    case 5: { if (Math.random() < 0.5) { const a = r(21, 89), b = r(10 - (a % 10), 9); return [`${a} + ${b}`, a + b]; } const a = r(21, 98), b = r((a % 10) + 1, 9); return [`${a} − ${b}`, a - b]; }
    case 6: { const a = r(2, 5), b = r(1, 10); return [`${a} × ${b}`, a * b]; }
    case 7: { const a = r(6, 9), b = r(2, 10); return Math.random() < 0.5 ? [`${a} × ${b}`, a * b] : [`${b} × ${a}`, a * b]; }
    case 8: { if (Math.random() < 0.5) { const a = r(15, 69), b = r(12, 99 - a); return [`${a} + ${b}`, a + b]; } const a = r(40, 99), b = r(11, a - 5); return [`${a} − ${b}`, a - b]; }
    case 9: { const a = r(2, 9), b = r(2, 10); return Math.random() < 0.6 ? [`${a * b} ÷ ${a}`, b] : [`${a} × ${b}`, a * b]; }
    default: { if (Math.random() < 0.5) { const a = r(3, 9), b = r(3, 9), c = r(2, 19); return [`${a} × ${b} + ${c}`, a * b + c]; } const a = r(12, 49), b = r(3, 8); return [`${a} × ${b}`, a * b]; }
  }
}

/* ---------------- Plus ou moins ? (sens du nombre) ---------------- */
function nuageSVG(nb, rayon) {
  const pts = []; let garde = 0;
  while (pts.length < nb && garde++ < 6000) { const r = rayon * (0.75 + Math.random() * 0.5); const p = { x: 6 + r + Math.random() * (88 - 2 * r), y: 6 + r + Math.random() * (88 - 2 * r), r }; if (pts.every(q => Math.hypot(q.x - p.x, q.y - p.y) > q.r + p.r + 1.2)) pts.push(p); }
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${pts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${p.r.toFixed(2)}" fill="var(--fam-lang)"/>`).join('')}</svg>`;
}

/* ---------- outils de tracé (doigt, stylet, souris) ---------- */
function zoneDessin(el, { vw = 100, vh = 100, fond = '', encre = 'var(--ink)', epaisseur = 3.4 } = {}) {
  el.innerHTML = `<svg viewBox="0 0 ${vw} ${vh}" class="dessin" style="aspect-ratio:${vw}/${vh}">${fond}<g class="encre" fill="none" stroke="${encre}" stroke-width="${epaisseur}" stroke-linecap="round" stroke-linejoin="round"></g></svg>`;
  const svg = el.querySelector('svg'), g = svg.querySelector('.encre');
  const traits = []; let courant = null, pathEl = null, actif = true;
  const pt = e => { const r = svg.getBoundingClientRect(); return { x: (e.clientX - r.left) * vw / r.width, y: (e.clientY - r.top) * vh / r.height, t: performance.now() }; };
  const maj = () => pathEl.setAttribute('d', courant.map((p, i) => (i ? 'L' : 'M') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' ') + (courant.length === 1 ? ' l0.01 0' : ''));
  const down = e => { if (!actif || e.button > 0) return; e.preventDefault(); try { svg.setPointerCapture(e.pointerId); } catch (_) { } courant = [pt(e)]; traits.push(courant); pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path'); g.appendChild(pathEl); maj(); };
  const move = e => { if (!courant) return; e.preventDefault(); const p = pt(e), l = courant[courant.length - 1]; if (Math.hypot(p.x - l.x, p.y - l.y) < 0.35) return; courant.push(p); maj(); };
  const up = () => { courant = null; };
  svg.addEventListener('pointerdown', down); svg.addEventListener('pointermove', move); svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  const nettoyer = () => { svg.removeEventListener('pointerdown', down); svg.removeEventListener('pointermove', move); svg.removeEventListener('pointerup', up); svg.removeEventListener('pointercancel', up); };
  RUN.cleanups.add(nettoyer);
  return { svg, traits, effacer() { traits.length = 0; g.innerHTML = ''; courant = null; }, bloquer() { actif = false; }, g };
}
function echantillonner(traitsModele, pas = 1.4) {
  return traitsModele.map(st => {
    const pts = [];
    st.forEach(seg => {
      if (seg[0] === 'L') { const [, x1, y1, x2, y2] = seg; const n = Math.max(1, Math.ceil(Math.hypot(x2 - x1, y2 - y1) / pas)); for (let i = 0; i <= n; i++) pts.push({ x: x1 + (x2 - x1) * i / n, y: y1 + (y2 - y1) * i / n }); }
      else { const [, cx, cy, r, a0, a1] = seg; const n = Math.max(2, Math.ceil(Math.abs(a1 - a0) * Math.PI / 180 * r / pas)); for (let i = 0; i <= n; i++) { const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180; pts.push({ x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) }); } }
    });
    return pts;
  });
}
const cheminPts = pts => pts.map((p, i) => (i ? 'L' : 'M') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' ');
function plusProche(p, arr) { let best = Infinity, bi = -1; for (let k = 0; k < arr.length; k++) { const q = arr[k], d = (q.x - p.x) ** 2 + (q.y - p.y) ** 2; if (d < best) { best = d; bi = k; } } return { d: Math.sqrt(best), k: bi }; }
function evaluerTrace(modele, traits, tol) {
  const U = traits.flat();
  if (U.length < 3) return { score: 0, couverture: 0, precision: 0, sens: 0 };
  const T = modele.flat();
  let cov = 0;
  const indices = modele.map(st => st.map(p => { const n = plusProche(p, U); if (n.d <= tol) { cov++; return n.k; } return null; }));
  const couverture = cov / T.length;
  const prec = U.filter(p => plusProche(p, T).d <= tol * 1.4).length / U.length;
  let paires = 0, bonnes = 0;
  indices.forEach(arr => { const v = arr.filter(x => x != null); for (let k = 4; k < v.length; k += 2) { if (v[k] === v[k - 4]) continue; paires++; if (v[k] > v[k - 4]) bonnes++; } });
  const sens = paires ? bonnes / paires : (couverture > 0.5 ? 1 : 0);
  return { score: clamp(0.45 * couverture + 0.35 * prec + 0.2 * sens * couverture, 0, 1), couverture, precision: prec, sens };
}

function pistePoints(type, phase = 0) {

      case 'arcades': y = yc + 10 - 20 * Math.abs(Math.sin(u * Math.PI * 5)); break;
      case 'boucles': { const th = u * Math.PI * 2 * 5; px = x0 + 6 + (x1 - x0 - 12) * u - 6 * Math.sin(th); y = yc + 10 * Math.cos(th); break; }

    }
    pts.push({ x: px, y });

  // un tracé juste y était compté « hors piste » (jusqu'à 23 % pour un tracé parfait). On échantillonne ces sauts (pas de 0,25).

}

}

  const n = pts.length, X = i => m.l + (n === 1 ? (W - m.l - m.r) / 2 : i * (W - m.l - m.r) / (n - 1)), Y = v => m.t + (hi - v) / (hi - lo) * (H - m.t - m.b);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(' ');
  const area = `${d} L${X(n - 1).toFixed(1)} ${H - m.b} L${X(0).toFixed(1)} ${H - m.b} Z`;
  const xl = [0, n > 4 ? Math.floor((n - 1) / 2) : -1, n - 1].filter((v, i, a) => v >= 0 && a.indexOf(v) === i);
  const data = pts.map((p, i) => ({ x: +X(i).toFixed(1), y: +Y(p.y).toFixed(1), t: `${p.label} · ${fmt(p.y)}` }));
  return `<div class="chart" data-pts='${esc(JSON.stringify({ W, H, data }))}'><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution sur ${n} passations">
    ${tk.map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${m.l - 8}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end">${esc(fmt(v))}</text>`).join('')}
    ${xl.map(i => `<text x="${X(i).toFixed(1)}" y="${H - 8}" text-anchor="${n === 1 ? 'middle' : i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}">${esc(pts[i].court)}</text>`).join('')}
    <path d="${area}" fill="${color}" opacity=".10"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${n <= 30 ? pts.map((p, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${i === n - 1 ? 5 : 3}" fill="${color}" stroke="var(--surface)" stroke-width="2"/>`).join('') : `<circle cx="${X(n - 1).toFixed(1)}" cy="${Y(pts[n - 1].y).toFixed(1)}" r="5" fill="${color}" stroke="var(--surface)" stroke-width="2"/>`}
    <line class="xh" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}" stroke="var(--ink-2)" stroke-width="1" opacity="0"/>
  </svg><div class="tip" hidden></div></div>`;
}
function sparkline(vals, { w = 96, h = 28, color = 'var(--primary)', max = null } = {}) {
  const v = vals.filter(x => x != null); if (v.length < 2) return `<svg width="${w}" height="${h}" aria-hidden="true"></svg>`;
  const lo = Math.min(...v, max != null ? 1 : Infinity), hi = max ?? Math.max(...v), rg = hi - lo || 1;
  const X = i => 3 + i * (w - 6) / (v.length - 1), Y = x => h - 4 - (x - lo) / rg * (h - 8);

}
function brancherGraphiques(root = document) {
  $$('.chart[data-pts]', root).forEach(c => {
    if (c._ok) return; c._ok = true;
    const { W, H, data } = JSON.parse(c.dataset.pts); const svg = $('svg', c), tip = $('.tip', c), xh = $('.xh', c);
    const move = e => {
      const r = svg.getBoundingClientRect(); const vx = (e.clientX - r.left) * W / r.width;
      let best = 0; data.forEach((d, i) => { if (Math.abs(d.x - vx) < Math.abs(data[best].x - vx)) best = i; });
      const d = data[best]; tip.hidden = false; tip.textContent = d.t;
      tip.style.left = clamp(d.x * r.width / W, 60, r.width - 60) + 'px'; tip.style.top = (d.y * r.height / H) + 'px';
      xh.setAttribute('x1', d.x); xh.setAttribute('x2', d.x); xh.setAttribute('opacity', '.35');
    };
    const out = () => { tip.hidden = true; xh.setAttribute('opacity', '0'); };
    svg.addEventListener('pointermove', move); svg.addEventListener('pointerdown', move); svg.addEventListener('pointerleave', out);
  });
}

function statsProfil(p) {

function jardinSVG(stade) {

  let f = '';
  for (let i = 0; i < feuilles; i++) { const y = 138 - 16 - i * (tige / (feuilles + 1)), g = i % 2 === 0; f += `<path d="M75 ${y} q ${g ? -26 : 26} -6 ${g ? -30 : 30} -22 q ${g ? 12 : -12} 18 ${g ? 30 : -30} 22z" fill="var(--logo-n)" opacity=".9"/>`; }
  const fleur = s >= 7 ? `<g transform="translate(75 ${138 - tige})">${range(6).map(k => `<circle cx="${Math.cos(k * Math.PI / 3) * 11}" cy="${Math.sin(k * Math.PI / 3) * 11}" r="8" fill="var(--logo-l)"/>`).join('')}<circle r="7" fill="var(--logo-e)"/></g>` : s >= 5 ? `<circle cx="75" cy="${138 - tige}" r="8" fill="var(--logo-e)"/>` : '';
  return `<svg viewBox="0 0 150 170" aria-hidden="true"><path d="M40 138h70l-8 28H48z" fill="var(--logo-a)"/><rect x="36" y="132" width="78" height="10" rx="3" fill="var(--logo-a)"/><path d="M75 138 V ${138 - tige}" stroke="var(--logo-n)" stroke-width="5" stroke-linecap="round"/>${f}${fleur}</svg>`;
}

function exportCSV() {

function importer(texte) {
  let d; try { d = JSON.parse(texte); } catch (e) { toast('Fichier illisible : ce n’est pas un JSON valide'); return; }
  if (d.schema !== SCHEMA || !Array.isArray(d.profils)) { toast('Format non reconnu (attendu : ' + SCHEMA + ')'); return; }
  let np = 0, nr = 0;
  d.profils.forEach(p => { const i = Store.data.profils.findIndex(x => x.id === p.id); if (i >= 0) Store.data.profils[i] = p; else { Store.data.profils.push(p); np++; } });
  const ids = new Set(Store.data.resultats.map(r => r.id));
  (d.resultats || []).forEach(r => { if (!ids.has(r.id)) { Store.data.resultats.push(r); nr++; } });
  Store.save(); Store.load(); render(); toast(`Import terminé : ${np} nouveau(x) profil(s), ${nr} passation(s)`);

function ouvrirRun(ex, p) {

function ecranConsigne(ex, p, niveau) {

    const onKey = e => { if (e.key === 'Enter') { e.preventDefault(); fin({ niveau: niv }); } else if (e.key === 'Escape') fin(null); };
    const fin = v => { stage.removeEventListener('click', onClick); document.removeEventListener('keydown', onKey); $('#run-x').onclick = null; resolve(v); };
    stage.addEventListener('click', onClick); document.addEventListener('keydown', onKey);

function ecranBilan(ex, p, r, { suivant, differeDispo }) {
  return new Promise(resolve => {
    const kid = p.groupe === 'enfant', stage = $('#run-stage'), resp = $('#run-resp');
    const nb = etoiles(r.perf ?? 0), montee = r.niveauSuivant > r.niveau, baisse = r.niveauSuivant < r.niveau;
    const titre = kid ? ['Continue comme ça !', 'Bien joué !', 'Bravo, super !'][nb - 1] : 'Exercice terminé';
    const cles = ex.mesures.filter(k => r.mesures[k] != null).slice(0, kid && !UI.prat.ok ? 3 : 8);
    const lv = ex.niveaux > 1 ? `<div class="lvl-change"><span class="arrow" style="background:var(--${montee ? 'ok-soft' : 'surface-2'});color:var(--${montee ? 'ok' : 'ink-2'})">${montee ? ICONS.up : baisse ? ICONS.down : ICONS.same}</span><div><b>${montee ? `Niveau ${r.niveauSuivant} débloqué` : baisse ? `On consolide au niveau ${r.niveauSuivant}` : `Niveau ${r.niveau} maintenu`}</b><br><span class="muted" style="font-size:.88rem">${montee ? 'La difficulté augmente à la prochaine partie.' : baisse ? 'Un palier plus accessible pour ancrer la réussite.' : 'Encore une partie à ce niveau pour stabiliser.'}</span></div></div>` : '';
    stage.innerHTML = `<div class="bilan">
      ${kid ? `<div class="stars">${range(3).map(i => etoileSVG(i < nb, 44)).join('')}</div>${gainBlocs(p, nb)}` : `<p class="eyebrow">${esc(DOMAINES[ex.domaine].nom)}</p>`}
      <h2>${titre}</h2>
      ${lv}
      ${cles.length ? `<div class="metrics">${cles.map(k => `<div class="metric"><span>${MESURES[k][0]}</span><b>${fmtMesure(k, r.mesures[k])}</b></div>`).join('')}</div>` : ''}
      ${blocEssaisBilan(r, kid)}
      ${differeDispo ? `<div class="notice info">Le rappel différé de la liste de mots est disponible.</div>` : ''}
      ${lienAvisJeu(ex, r)}
    </div>`;
    const btns = [];
    if (differeDispo) btns.push(['differe', 'Faire le rappel', '']);
    if (suivant) { btns.push(['fermer', 'Accueil', '']); btns.push(['suivant', `Suivant : ${nomEx(EXOS[suivant], p)}`, 'main-go']); }
    else { if (!ex.cache) btns.push(['rejouer', 'Rejouer', '']); btns.push(['fermer', 'Terminer', 'main-go']); }
    resp.className = 'run-resp'; resp.innerHTML = btns.map(([id, l, c]) => `<button type="button" class="resp-btn ${c}" data-b="${id}">${esc(l)}</button>`).join('');
    if (p.reglages.son) Sound.fin();
    const onClick = e => { const b = e.target.closest('[data-b]'); if (b) fin(b.dataset.b); };
    const onKey = e => { if ($('#modal-root .modal-back')) return; if (e.key === 'Enter') { e.preventDefault(); fin(suivant ? 'suivant' : 'fermer'); } else if (e.key === 'Escape') fin('fermer'); };
    const fin = v => { resp.removeEventListener('click', onClick); document.removeEventListener('keydown', onKey); $('#run-x').onclick = null; resolve(v); };
    resp.addEventListener('click', onClick); document.addEventListener('keydown', onKey);
    $('#run-x').onclick = () => fin('fermer');
  });
}
let quitterArme = 0;
async function lancerExercice(exId, opts = {}) {
  const p = Store.actif, ex = EXOS[exId]; if (!p || !ex || RUN.actif) return;
  const mode = opts.mode || (UI.prat.ok ? 'seance' : 'libre');
  Sound.unlock();
  ouvrirRun(ex, p);
  const choix = await ecranConsigne(ex, p, Store.niveau(p, exId));
  if (!choix) { fermerRun(); render(); return; }
  Voice.unlock();
  RUN.aborted = false; RUN.actif = true; RUN.rejecters.clear(); RUN.cleanups.clear();
  $('#run-stage').innerHTML = ''; $('#run-resp').innerHTML = '';
  $('#run-x').onclick = () => {
    if (Date.now() - quitterArme < 2500) { abortRun(); return; }
    quitterArme = Date.now(); toast('Touchez à nouveau ✕ pour quitter (la partie ne sera pas enregistrée)');
  };
  const ctx = makeCtx(ex, p, choix.niveau, opts);
  const t0 = Date.now(); let res;
  try { res = await ex.run(ctx); }
  catch (e) {
    const annule = e instanceof Abort || e?.name === 'Abort';
    abortRun(); RUN.actif = false; fermerRun(); render();
    if (!annule) { console.error(e); toast('Un problème est survenu pendant l’exercice. Il n’a pas été enregistré.'); }
    return;
  }
  for (const c of [...RUN.cleanups]) { try { c(); } catch (e) { } }
  RUN.cleanups.clear(); RUN.actif = false; Voice.cancel();
  let suivantNiv = res.niveauSuivant;
  if (suivantNiv == null) { const pf = res.perf ?? 0; suivantNiv = choix.niveau + (pf >= ex.seuils[1] ? 1 : pf < ex.seuils[0] ? -1 : 0); }
  suivantNiv = clamp(Math.round(suivantNiv), 1, ex.niveaux);
  const r = { id: uid(), profilId: p.id, exId, date: Date.now(), duree: Math.round((Date.now() - t0) / 1000), niveau: choix.niveau, niveauSuivant: suivantNiv, mode, perf: round(res.perf ?? 0, 3), mesures: Object.fromEntries(Object.entries(res.mesures || {}).filter(([, v]) => v != null && !Number.isNaN(v))), details: res.details || {}, essais: ctx._essais || [] };
  Store.data.resultats.push(r);
  if (ex.niveaux > 1) p.niveaux[exId] = suivantNiv;
  Store.save();
  if (res.apres) res.apres(r);
  let suivant = null;
  if (mode === 'programme') { marquerFait(p, exId); const s = seanceDuJour(p); suivant = s ? s.exos.find(id => !s.faits.includes(id)) || null : null; }
  const d = differeDe(p), differeDispo = !!(d && d.dispoLe <= Date.now() && exId !== 'liste-differe');
  const action = await ecranBilan(ex, p, r, { suivant, differeDispo });
  fermerRun(); render();
  if (action === 'suivant' && suivant) lancerExercice(suivant, { mode: 'programme' });
  else if (action === 'rejouer') lancerExercice(exId, { mode });
  else if (action === 'differe') { const dd = differeDe(p); if (dd) lancerExercice('liste-differe', { mode, differeId: dd.id }); }
}

/* ---------- données d'exemple ---------- */
function fauxMesures(ex, niveau, kid, t) {
  const bruit = a => (Math.random() * 2 - 1) * a, pos = v => Math.max(0, Math.round(v));
  const f = {
    precision: () => clamp(Math.round(70 + 20 * t + bruit(6)), 40, 100), trMoyen: () => Math.round((kid ? 780 : 560) - 120 * t + bruit(40)), trSd: () => Math.round((kid ? 230 : 150) - 60 * t + bruit(20)),
    omissions: () => pos(7 - 5 * t + bruit(2)), commissions: () => pos(6 - 4 * t + bruit(2)), dprime: () => round(1.5 + 1.3 * t + bruit(0.3), 2), decrement: () => Math.round(9 - 6 * t + bruit(3)),
    empan: () => niveau + 1, essais: () => randInt(5, 9), coutInterference: () => Math.round(135 - 60 * t + bruit(20)), coutAlternance: () => Math.round(270 - 110 * t + bruit(40)),
    erreurs: () => pos(5 - 3 * t + bruit(1.5)), erreursPerseveration: () => pos(3 - 2 * t + bruit(1)), correctsMin: () => round((kid ? 14 : 26) + 8 * t + bruit(2), 1),
    temps: () => Math.round(62 - 15 * t + bruit(5)), tempsA: () => round(36 - 9 * t + bruit(3), 1), tempsB: () => round(82 - 24 * t + bruit(6), 1), ratioBA: () => round(2.3 - 0.4 * t + bruit(0.15), 2),

  const a = new Uint32Array(8);
  try { crypto.getRandomValues(a); } catch (e) { for (let i = 0; i < 8; i++) a[i] = Math.floor(Math.random() * 1e9); }
  const s = Array.from(a, x => ALPHABET_CODE[x % ALPHABET_CODE.length]).join('');
  return 'ELAN-' + s.slice(0, 4) + '-' + s.slice(4);
}
function normCode(c) {
  let n = String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (n.length === 12 && n.startsWith('ELAN')) n = n.slice(4);
  return n;
}

function visibleQ(q, v, kid) {

}

/* Temps au lit, sommeil total (minutes) et efficacité (%) : même calcul que l'agenda Apps Script. */
function calcSommeil(v) {
  if (!v.coucher || !v.extinction || !v.reveil || !v.lever) return { erreur: 'Horaires incomplets.', etape: 0 };
  let c = hmVersMin(v.coucher), x = hmVersMin(v.extinction), r = hmVersMin(v.reveil), l = hmVersMin(v.lever);
  if (c < 900) c += 1440;              // le soir est compté à partir de 15 h : 1 h du matin = 25 h
  if (x < 900) x += 1440;
  if (x < c) return { erreur: 'L’heure d’extinction doit être après l’heure du coucher.', etape: 0 };
  while (r <= x) r += 1440;
  while (l < r) l += 1440;
  if (r - x > 18 * 60) return { erreur: 'Vérifiez l’heure d’extinction et l’heure du réveil définitif.', etape: 2 };
  if (l - r > 12 * 60) return { erreur: 'L’heure du lever doit être après le réveil définitif.', etape: 2 };
  const latence = Number(v.latence) || 0, eveil = Number(v.nbReveils) > 0 ? (Number(v.dureeReveils) || 0) : 0;
  const tib = l - c, tst = (r - x) - latence - eveil;
  if (tst <= 0) return { erreur: 'Le temps de sommeil calculé est nul : vérifiez les horaires, le délai d’endormissement et la durée des réveils.', etape: 2 };
  return { tib, tst, se: tib > 0 ? round(Math.min(1, tst / tib) * 100, 1) : 0, coucherMin: c };
}

  return p.groupe === 'enfant' ? [9, 12, '6 à 12 ans'] : [7, 9, 'adultes'];
}

/* ---------- nettoyage ---------- */
function nettoyerOrphelins() {
  const d = Store.data, ids = new Set(d.profils.map(p => p.id)); let n = 0;
  for (const k of ['sommeil', 'journal', 'questionnaires']) { const av = d[k].length; d[k] = d[k].filter(x => ids.has(x.profilId)); n += av - d[k].length; }
  (d.enseignants || []).forEach(E => { const av = E.eleves.length; E.eleves = E.eleves.filter(x => !x.profilId || ids.has(x.profilId)); n += av - E.eleves.length; });
  if (n) Store.save();
}

/* ---------- générateurs de données d'exemple ---------- */
function demoNuits(d, p) {
  const kid = p.groupe === 'enfant', proche = (opts, v) => opts.reduce((a, b) => Math.abs(b - v) < Math.abs(a - v) ? b : a);
  const evtsA = ['Pensées qui tournent en boucle', 'Cauchemars / rêves pénibles', 'Envie d’uriner', 'Anxiété, cœur qui bat vite'];
  const evtsE = ['Cauchemars', 'A appelé ou rejoint le lit des parents', 'Peur du noir / de rester seul'];
  for (let i = 22; i >= 2; i--) {
    const t = (22 - i) / 20, nuit = dk(Date.now() - i * 864e5), jour = dateNuit(nuit).getDay();
    const c = kid ? 20 * 60 + 30 + randInt(-10, 20) : 23 * 60 + randInt(-15, 30), x = c + randInt(10, 22);
    const nbReveils = kid ? pick(t > 0.5 ? [0, 0, 0, 1] : [0, 1, 1, 2]) : pick(t > 0.5 ? [0, 1, 1, 2] : [1, 2, 2, 3]);
    const r = (kid ? 6 * 60 + 55 : 6 * 60 + 40) + randInt(-10, 12), l = r + randInt(kid ? 5 : 10, kid ? 15 : 25);
    const note = (a, b, lo = 1, hi = 5) => clamp(Math.round(a + (b - a) * t + (Math.random() - 0.5) * 1.4), lo, hi);
    const evts = Math.random() < 0.3 ? [pick(kid ? evtsE : evtsA)] : ['Rien de particulier'];
    const cafeine = kid ? (Math.random() < 0.15 ? 1 : 0) : pick(t > 0.5 ? [1, 1, 2] : [2, 2, 3]);
    const v = { id: uid(), profilId: p.id, nuit, coucher: minVersHm(c), extinction: minVersHm(x),
      latence: proche([5, 10, 15, 20, 30, 45, 60, 90, 120], (kid ? 45 - 25 * t : 55 - 30 * t) + randInt(-8, 8)),
      nbReveils, dureeReveils: nbReveils ? proche([5, 10, 15, 30, 45, 60, 90, 120, 180], nbReveils * (kid ? 6 : 14)) : null,
      evenements: evts, reveil: minVersHm(r), lever: minVersHm(l), typeReveil: kid ? pick(['Spontanément', 'Réveillé par un adulte ou un bruit']) : 'Avec un réveil / une alarme',
      qualite: note(2, 4), repose: note(2, 4), humeur: note(4, 7, 0, 10), anxiete: note(kid ? 5 : 7, 3, 0, 10), energie: note(3, 6, 0, 10),
      sieste: !kid && Math.random() < 0.15 ? 'Oui' : 'Non', cafeine, alcool: kid ? undefined : pick([0, 0, 0, 1]),
      sport: pick(['Aucune', 'Dans la journée', 'Dans la journée']), ecrans: Math.random() < 0.7 - 0.4 * t ? pick(['Moins de 30 min', '30 min ou plus']) : 'Non',
      traitement: kid ? 'Oui, comme d’habitude' : 'Non', traitementDetail: kid ? 'Mélatonine 1 mg à 20 h (exemple fictif)' : '', seanceNF: (jour === 2 || jour === 5) ? 'Oui' : 'Non', remarques: '', date: Date.now() - (i - 1) * 864e5 };
    if (v.sieste === 'Oui') v.siesteDuree = 20;
    if (cafeine > 0) v.cafeineTard = !kid && Math.random() < 0.5 - 0.3 * t ? 'Oui' : 'Non';
    v.calc = calcSommeil(v);
    if (v.calc.erreur) continue;
    d.sommeil.push(v);
  }
}
function demoJournal(d, p) {
  for (let i = 21; i >= 1; i--) {
    if (Math.random() < 0.15) continue;
    const t = (21 - i) / 20, n = (a, b) => clamp(Math.round(a + (b - a) * t + (Math.random() - 0.5) * 1.5), 1, 5);
    d.journal.push({ id: uid(), profilId: p.id, jour: dk(Date.now() - i * 864e5), valeurs: { humeur: n(3, 4), energie: n(2, 4), concentration: n(2, 4), tension: n(4, 2) }, note: '', date: Date.now() - i * 864e5 });
  }
}
function demoCentre(p, semaines, nb, dansJours, heure) {
  const c = p.centre ??= { seances: [], prochainRdv: null, bilanTous: 16 };
  const debut = Date.now() - semaines * 7 * 864e5;
  c.seances = [{ id: uid(), date: debut, type: 'bilan', note: 'Bilan initial : anamnèse et EEG quantifié. Le compte rendu vous a été remis.' }];
  const notes = ['Séance calme, belle stabilité sur la fin.', 'Plus de facilité à garder la cible que la semaine dernière.', 'Séance plus agitée : fatigue en fin de journée, c’est normal.', 'Très bonne régularité, on garde les mêmes réglages.'];
  const pas = (Date.now() - 864e5 - (debut + 7 * 864e5)) / Math.max(1, nb - 1);
  for (let i = 0; i < nb; i++) c.seances.push({ id: uid(), date: debut + 7 * 864e5 + Math.round(i * pas), type: 'seance', note: i % 3 === 1 ? pick(notes) : '' });
  const rdv = new Date(Date.now() + dansJours * 864e5); const [h, m] = heure.split(':'); rdv.setHours(+h, +m, 0, 0);
  c.prochainRdv = rdv.getTime();
}

function installerEvenementsElan() {
  document.addEventListener('submit', e => {
    const f = e.target;
    const err = (id, t) => { const el = $('#' + id); if (el) { el.textContent = t; el.hidden = false; } };
    const pinOk = v => /^\d{4}$/.test(v || '');
    if (f.id === 'f-code') {
      e.preventDefault();
      const val = $('#code-in').value, erreur = t => { err('code-err', t); $('#code-in').setAttribute('aria-invalid', 'true'); };
      if (!val.trim()) return erreur('Saisissez le code reçu.');
      const lien = lienParCode(val);
      if (lien) { modalActivation(lien.l.cible === 'enfant' ? 'lien-enfant' : 'lien-parent', lien.p, lien.l); return; }
      const p = profilParCode(val);
      if (!p) return erreur('Code introuvable. Vérifiez les caractères (sans O ni I) ou demandez un nouveau code à votre praticienne.');
      if (p.acces.statut === 'desactive') return erreur('Ce code a été désactivé. Contactez le centre Élan pour en recevoir un nouveau.');
      modalActivation(p.groupe !== 'enfant' ? 'adulte' : familleDe(p).parentPin && p.acces.statut === 'active' ? 'famille-connue' : 'famille', p);
    }
    if (f.id === 'f-act') {
      e.preventDefault(); const A = UI.activation, p = A && Store.profil(A.profilId); if (!p) return;
      if (A.type === 'adulte') { if (!$('#act-ok').checked) return err('act-err', 'Cochez la case pour accepter le partage avec le centre.'); marquerActive(p); ouvrirSession('adulte', { profilId: p.id, appareil: 'adulte' }); }
      else if (A.type === 'famille') {
        const fd = new FormData(f), pin = fd.get('act-pin'), pin2 = fd.get('act-pin2');
        if (!$('#act-ok').checked) return err('act-err', 'Cochez la case pour accepter le partage avec le centre.');
        if (!pinOk(pin)) return err('act-err', 'Le code parent doit comporter 4 chiffres.');
        if (pin !== pin2) return err('act-err', 'Les deux codes ne sont pas identiques.');
        const fam = familleDe(p), app = fd.get('act-app') === 'parent' ? 'parent' : 'partage';
        fam.parentPin = pin; marquerActive(p); ajouterAppareil(p, app, app === 'partage' ? 'Appareil partagé' : 'Appareil parent');
        ouvrirSession('parent', { profilId: p.id, appareil: app }); UI.parentOuvert = true;
      }
      else if (A.type === 'famille-connue') {
        const fam = familleDe(p), fd = new FormData(f); if (fd.get('act-pin') !== fam.parentPin) return err('act-err', 'Code parent incorrect.');
        const app = fd.get('act-app') === 'parent' ? 'parent' : 'partage'; ajouterAppareil(p, app, app === 'partage' ? 'Appareil partagé' : 'Appareil parent');
        ouvrirSession('parent', { profilId: p.id, appareil: app }); UI.parentOuvert = true;
      }
      else if (A.type === 'lien-enfant') { const fam = familleDe(p); fam.liens = fam.liens.filter(l => l.code !== A.lien); ajouterAppareil(p, 'enfant', `Appareil ${deT(p.prenom)}`); ouvrirSession('enfant', { profilId: p.id, appareil: 'enfant' }); }
      else { const fam = familleDe(p), pin = new FormData(f).get('act-pin'); if (pin !== fam.parentPin) return err('act-err', 'Code parent incorrect.'); fam.liens = fam.liens.filter(l => l.code !== A.lien); ajouterAppareil(p, 'parent', 'Autre appareil parent'); ouvrirSession('parent', { profilId: p.id, appareil: 'parent' }); }
      UI.activation = null; Store.save(); fermerModal(); render(); window.scrollTo(0, 0); toast('C’est prêt : bienvenue dans Élan');
    }
    if (f.id === 'f-public-enfant') {
      e.preventDefault(); const fd = new FormData(f), prenom = (fd.get('prenom') || '').trim(), pin = fd.get('pe-pin');
      if (!prenom) return err('pe-err', 'Indiquez le prénom de votre enfant.');
      if (!pinOk(pin)) return err('pe-err', 'Le code parent doit comporter 4 chiffres.');
      if (pin !== fd.get('pe-pin2')) return err('pe-err', 'Les deux codes ne sont pas identiques.');
      const besoins = fd.getAll('besoins');
      const p = nouveauProfil({ prenom, naissance: fd.get('naissance') || '', groupe: 'enfant', motif: '' });
      Object.assign(p, { origine: 'abonne', besoins, centre: { seances: [], prochainRdv: null, bilanTous: 16 }, programme: programmeDepuisBesoins(besoins) });
      Store.data.profils.push(p);
      const fam = familleDe(p), app = fd.get('pe-app') === 'parent' ? 'parent' : 'partage';
      fam.parentPin = pin; fam.abonnement = nouvelAbonnement(UI.formuleChoisie || 'annuel'); ajouterAppareil(p, app, app === 'partage' ? 'Appareil partagé' : 'Appareil parent');
      ouvrirSession('parent', { profilId: p.id, appareil: app }); UI.parentOuvert = true;
      fermerModal(); render(); window.scrollTo(0, 0); toast(`Essai gratuit activé pour ${OFFRE.essaiJours} jours`);
    }
    if (f.id === 'f-public-adulte') {
      e.preventDefault(); const fd = new FormData(f), prenom = (fd.get('prenom') || '').trim(); if (!prenom) { $('#pa-prenom').focus(); return; }
      const besoins = fd.getAll('besoins'), enfant = (fd.get('enfant') || '').trim();
      const p = nouveauProfil({ prenom, naissance: fd.get('naissance') || '', groupe: 'adulte', motif: '' });
      Object.assign(p, { origine: 'abonne', besoins, centre: { seances: [], prochainRdv: null, bilanTous: 16 }, programme: programmeDepuisBesoins(besoins), abonnement: nouvelAbonnement(UI.formuleChoisie || 'annuel') });
      if (enfant) p.partieParents = { actif: true, enfantPrenom: enfant, enfantNaissance: fd.get('enfantNaissance') || '' };
      Store.data.profils.push(p); ouvrirSession('adulte', { profilId: p.id, appareil: 'adulte' });
      fermerModal(); render(); window.scrollTo(0, 0); toast(`Essai gratuit activé pour ${OFFRE.essaiJours} jours`);
    }
    if (f.id === 'f-enseignant') {
      e.preventDefault(); const fd = new FormData(f), prenom = (fd.get('prenom') || '').trim(), nom = (fd.get('nom') || '').trim(); if (!prenom || !nom) return;
      const E = { id: uid(), prenom, nom, etablissement: (fd.get('etablissement') || '').trim(), niveau: fd.get('niveau') || '', email: '', abonnement: UI.ensPlus ? { mode: 'abonne', formule: UI.ensPlus, debut: Date.now(), essaiFin: Date.now() } : { mode: 'gratuit' }, usage: { mois: moisCourant(), n: 0 }, eleves: [] };
      Store.data.enseignants.push(E); ouvrirSession('enseignant', { enseignantId: E.id, appareil: 'enseignant' });
      fermerModal(); render(); window.scrollTo(0, 0); toast(UI.ensPlus ? 'Enseignant+ activé (simulation)' : 'Votre espace enseignant gratuit est prêt'); UI.ensPlus = null;
    }
    if (f.id === 'f-partie-parents') {
      e.preventDefault(); const p = profilSession(), fd = new FormData(f), enfant = (fd.get('enfant') || '').trim(); if (!p || !enfant) return;
      p.partieParents = { actif: true, enfantPrenom: enfant, enfantNaissance: fd.get('naissance') || '' }; Store.save(); fermerModal(); UI.vue = 'parents'; render(); window.scrollTo(0, 0); toast('Partie parents ajoutée');
    }
    if (f.id === 'f-invit') {
      e.preventDefault(); const p = profilSession(); if (!p) return; const fd = new FormData(f);
      genererInvitation(p, { amenagements: true }); render(); toast('Code d’invitation créé');
    }
    if (f.id === 'f-pin-parent') {
      e.preventDefault(); const p = profilSession(), v = $('#np-pin').value; if (!p) return;
      if (!pinOk(v)) { toast('Le code doit comporter 4 chiffres'); return; }
      familleDe(p).parentPin = v; tracer(p, 'parent', 'code', null); Store.save(); render(); toast('Code parent modifié');
    }
    if (f.id === 'f-code-enfant') {
      e.preventDefault(); const p = profilSession(), v = $('#ce-pin').value; if (!p) return;
      if (!pinOk(v)) { toast('Ton code doit avoir 4 chiffres'); return; }
      familleDe(p).codeEnfant = v; UI.enfantOuvert = true; Store.save(); render(); toast('Ton espace est protégé');
    }
    if (f.id === 'f-ctr') {
      e.preventDefault(); const pp = UI.prat.patientId && Store.profil(UI.prat.patientId); if (!pp) return;
      const fd = new FormData(f), date = fd.get('date'); if (!date) return;
      const t = new Date(date + 'T12:00:00').getTime();
      pp.centre.seances.push({ id: uid(), date: t, type: fd.get('type') || 'seance', note: (fd.get('note') || '').trim() });
      Store.save(); render(); toast('Séance ajoutée');
    }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.partage) { const q = profilSession(); if (!q) return; const [proprio, k] = t.dataset.partage.split(':'); if (proprio !== session().role) return; changerPartage(q, proprio, k, t.checked); render(); toast(t.checked ? 'Partagé' : 'Ce n’est plus partagé'); return; }
    const pp = UI.prat.patientId && Store.profil(UI.prat.patientId); if (!pp) return;
    if (t.dataset.acc === 'email') { pp.acces.email = t.value.trim(); Store.save(); render(); return; }
    if ('rdv' in t.dataset) { pp.centre.prochainRdv = t.value ? new Date(t.value).getTime() : null; Store.save(); toast('Rendez-vous enregistré'); render(); return; }
    if ('bilan' in t.dataset) { pp.centre.bilanTous = clamp(parseInt(t.value, 10) || 16, 4, 60); Store.save(); render(); }
  }, true);
  ['input', 'change'].forEach(ev => document.addEventListener(ev, e => { const t = e.target; if (t.dataset?.slq && UI.sl) { UI.sl.v[t.dataset.slq] = t.value; UI.sl.manque = UI.sl.manque.filter(x => x !== t.dataset.slq); t.closest('.q-bloc')?.classList.remove('manque'); } }));
  document.addEventListener('input', e => { if (e.target.id === 'code-in') { const err = $('#code-err'); if (err) err.hidden = true; e.target.removeAttribute('aria-invalid'); } });
}

function memoPap(E, type) {
  const eleves = elevesFiltres(E), moments = MEMO_TYPES[type].moments;
  return moments.map(mid => {

    PAP.filter(a => a.m === mid).forEach(a => { const qui = eleves.filter(x => x.pap.includes(a.id)); if (qui.length) lignes.push({ k: a.id, t: a.t, qui }); });
    eleves.forEach(x => x.perso.filter(a => a.m === mid).forEach(a => lignes.push({ k: a.id, t: a.t, qui: [x] })));
    lignes.sort((a, b) => b.qui.length - a.qui.length);
    return { m: PAP_MOMENTS.find(m => m.id === mid), lignes };
  }).filter(g => g.lignes.length);
}

    const p = centre(e), vx = p.x - c.x, vy = p.y - c.y;
    const prim = dx ? vx * dx : vy * dy; if (prim <= 4) continue;
    const s = prim + (dx ? Math.abs(vy) : Math.abs(vx)) * 2.2;
    if (s < bs) { bs = s; best = e; }

  marquer(best || cur); return true;
}
function activer(el) {
  const id = el.dataset.choice;
  const choix = id != null ? (KB.ctx?._choices || []).find(c => String(c.id) === id) : null;
  KB.synth = true;
  try {
    if (choix?.keys?.length) document.dispatchEvent(new KeyboardEvent('keydown', { key: choix.keys[0], bubbles: true, cancelable: true }));
    else el.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, detail: 0, view: window }));
  } finally { KB.synth = false; }
}

/* ---------- viseur au clavier (poursuite, cibles, ligne des nombres) ---------- */
function zoneViseur() {
  const ex = KB.ctx?.ex; if (!runOuvert() || !ex || !JEUX_VISEUR.includes(ex.id)) return null;
  const z = $('#run-stage #zp') || $('#run-stage #ln'); return z && visible(z) ? z : null;
}
function viseurEl(z) {
  let v = z.querySelector(':scope > .viseur-kb');
  if (!v) { v = document.createElement('div'); v.className = 'viseur-kb' + (z.id === 'ln' ? ' ligne' : ''); v.setAttribute('aria-hidden', 'true'); z.appendChild(v); }
  return v;
}
function pointer(z, type) {
  const r = z.getBoundingClientRect(), V = KB.vis;
  const x = r.left + V.x * r.width, y = z.id === 'ln' ? r.top + r.height / 2 : r.top + V.y * r.height;
  z.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, clientX: x, clientY: y, button: 0, buttons: type === 'pointerup' ? 0 : 1, pointerId: 77, pointerType: 'mouse', isPrimary: true }));
}
function dessinerViseur(z) {
  const v = viseurEl(z); v.style.left = (KB.vis.x * 100) + '%'; if (z.id !== 'ln') v.style.top = (KB.vis.y * 100) + '%';
}
function boucleViseur(t0) {
  let prev = t0;
  const pas = now => {
    const z = zoneViseur();
    if (!z || !KB.vis) { KB.boucle = 0; return; }
    const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
    let dx = 0, dy = 0; KB.tenues.forEach(k => { const f = FLECHES[k]; if (f) { dx += f[0]; dy += f[1]; } });
    if (dx || dy) {
      KB.vis.tenue = (KB.vis.tenue || 0) + dt;
      const ligne = z.id === 'ln', base = ligne ? 0.22 : 0.42, max = ligne ? 0.45 : 0.95;
      const v = Math.min(max, base + KB.vis.tenue * (ligne ? 0.25 : 0.9));
      const n = Math.hypot(dx, dy) || 1;
      if (!ligne || KB.vis.tenue > 0.25) { KB.vis.x = clamp(KB.vis.x + dx / n * v * dt, 0, 1); KB.vis.y = clamp(KB.vis.y + (ligne ? 0 : dy / n * v * dt), 0, 1); }
    } else KB.vis.tenue = 0;

}
function viseurTouche(e, z) {
  if (FLECHES[e.key]) {

    if (!e.repeat && z.id === 'ln') KB.vis.x = clamp(KB.vis.x + FLECHES[e.key][0] * 0.01, 0, 1);
    KB.tenues.add(e.key); dessinerViseur(z);
    if (!KB.boucle) boucleViseur(performance.now());
    return true;
  }
  if ((e.key === ' ' || e.key === 'Enter') && KB.vis && KB.ctx?.ex?.id !== 'poursuite') {
    if (e.repeat) return true;
    pointer(z, 'pointerdown'); pointer(z, 'pointerup'); return true;
  }
  return false;
}

/* ---------- écoute globale (phase de capture : avant les jeux) ---------- */
document.addEventListener('keydown', e => {
  if (KB.synth || !runOuvert() || document.querySelector('#modal-root .modal-back') || e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target; if (t && (t.matches?.('input, textarea, select') || t.isContentEditable)) return;
  const z = zoneViseur();
  if (z) { if (viseurTouche(e, z)) { e.preventDefault(); e.stopImmediatePropagation(); } return; }
  if (FLECHES[e.key]) {
    if (toucheDuJeu(e.key)) return;
    if (deplacer(...FLECHES[e.key])) { e.preventDefault(); e.stopImmediatePropagation(); }
    return;
  }
  if (e.key === ' ' || e.key === 'Enter') {
    if (e.key === 'Enter' && toucheDuJeu('Enter')) return; // Entrée garde son rôle « Valider » dans le jeu
    let el = KB.el;
    if (el && !el.isConnected) { const els = cibles(); el = retrouver(els); if (el) marquer(el, { defiler: false }); }
    if (!el || !visible(el) || !cibles().includes(el)) return;
    e.preventDefault(); e.stopImmediatePropagation();
    if (!e.repeat) activer(el);
  }
}, true);
document.addEventListener('keyup', e => { if (FLECHES[e.key]) KB.tenues.delete(e.key); }, true);
window.addEventListener('blur', () => KB.tenues.clear());

/* garde le repère sur la même réponse quand le jeu redessine les boutons */
(() => {
  const run = $('#run'); if (!run) return;
  let attente = 0;
  const suivre = () => {
    attente = 0;
    if (!runOuvert()) { marquer(null); KB.pos = null; KB.cle = null; KB.vis = null; KB.tenues.clear(); return; }
    if (KB.el && !KB.el.isConnected && Date.now() - KB.vu < 20000) { const r = retrouver(cibles()); if (r) marquer(r, { defiler: false }); }
    const z = zoneViseur(); if (z && KB.vis && !z.querySelector(':scope > .viseur-kb')) dessinerViseur(z);
  };
  new MutationObserver(() => { if (!attente) attente = requestAnimationFrame(suivre); }).observe(run, { childList: true, subtree: true, attributes: true, attributeFilter: ['hidden'] });
})();

/* ============ Élan — journal des essais : bonnes réponses, erreurs et pourquoi (v0.8) ============
   Demande de Sarah (05/10/2026) : vérifier que chaque jeu compte les bonnes et les mauvaises réponses,
   et savoir pendant et après le jeu quand l'enfant a bon ou faux, et pourquoi.
   API pour les jeux :
     ctx.essai({ ok, stim, attendu, donne, pourquoi, rt, badge })
       ok       true (bonne réponse), false (erreur), null (essai non noté)
       stim     ce qui était montré, en clair (« Le renard », « 3 – 8 – 1 »)
       attendu  la bonne réponse
       donne    la réponse donnée (null = pas de réponse à temps)
       pourquoi l'explication courte d'une erreur (« C'était le chat, pas le renard »)
       rt       temps de réponse (ms)
       badge    false pour ne pas afficher le retour à l'écran (le jeu l'affiche déjà)
   Si un jeu appelle ctx.flash(ok) sans ctx.essai, l'essai est noté automatiquement avec la dernière réponse. */

const ESSAIS_MAX = 300;
const NOMS_FORMES = { rond: ['rond', 0], carre: ['carré', 0], triangle: ['triangle', 0], croix: ['croix', 1], losange: ['losange', 0], hexagone: ['hexagone', 0], etoile: ['étoile', 1], coeur: ['cœur', 0], lune: ['lune', 1], fleche: ['flèche', 1], pentagone: ['pentagone', 0], ovale: ['ovale', 0], demi: ['demi-cercle', 0], trapeze: ['trapèze', 0] };

function descForme(forme, couleur) {
  const [nom, fem] = NOMS_FORMES[forme] || [String(forme || '').replace(/-/g, ' '), 0];
  const c = String(couleur || ''); if (!c || c.startsWith('var(') || c.startsWith('#')) return nom;
  return `${nom} ${fem ? (FEM_COULEUR[c] || c) : c}`;
}
const court = (v, n = 60) => (v == null ? null : String(v).replace(/\s+/g, ' ').trim().slice(0, n));
function resumeScene() {
  const st = $('#run-stage'); if (!st) return '';
  const cible = st.querySelector('.stim, [data-desc]'); if (!cible) return '';
  const desc = [...st.querySelectorAll('.stim [data-desc], .stim[data-desc]')].map(e => e.dataset.desc).join(' ');
  return court(desc || cible.dataset?.desc || cible.textContent, 50) || '';
}
function libelleReponse(el) {
  if (!el) return null;
  const d = el.querySelector?.('[data-desc]')?.dataset.desc;
  return court(el.getAttribute?.('aria-label') || d || el.textContent?.replace(/\b(entrée|espace)\b/gi, ''), 40);
}

const _makeCtxEssais = makeCtx;
makeCtx = function (...args) {
  const c = _makeCtxEssais(...args);
  c._essais = []; c._derniere = null; c._essaiT = -1e9;
  const t0 = performance.now();
  c.essai = function ({ ok = null, stim = null, attendu = null, donne, pourquoi = null, rt = null, badge = true } = {}) {
    const rep = donne === undefined ? this._derniere?.label ?? null : donne;
    const e = { n: this._essais.length + 1, t: Math.round(performance.now() - t0), ok, stim: court(stim ?? resumeScene()), attendu: court(attendu), donne: court(rep), pourquoi: court(pourquoi, 90), rt: rt == null ? (this._derniere?.rt ?? null) : Math.round(rt) };
    if (this._essais.length < ESSAIS_MAX) this._essais.push(e);
    this._essaiT = performance.now(); this._derniere = null;
    if (badge && this.retour && ok !== null) badgeEssai(e, this.kid);
    return e;
  };
  const flash0 = c.flash;
  c.flash = function (ok, o) {
    // un ctx.essai() appelé juste avant (même instant) décrit déjà cette réponse ; sinon on la note automatiquement
    if (typeof ok === 'boolean' && performance.now() - this._essaiT > 40) this.essai({ ok, badge: false });
    return flash0.call(this, ok, o);
  };
  const answer0 = c.answer;
  c.answer = function (o) {
    const pr = answer0.call(this, o);
    Promise.resolve(pr).then(r => { if (r) { const ch = this._choices.find(x => String(x.id) === String(r.id)); this._derniere = r.id == null ? { label: null, rt: null } : { label: court(ch?.aria || ch?.label || libelleReponse(this.resp.querySelector(`[data-choice="${CSS.escape(String(r.id))}"]`)) || r.id, 40), rt: r.rt }; } }, () => { });
    return pr;
  };
  const tap0 = c.tap;
  c.tap = function (sel, o) {
    const pr = tap0.call(this, sel, o);
    Promise.resolve(pr).then(r => { if (!r) return; if (r.timeout) this._derniere = { label: null, rt: null }; else if (r.el) this._derniere = { label: libelleReponse(r.el), rt: r.rt }; else if (r.choice != null) { const ch = this._choices.find(x => String(x.id) === String(r.choice)); this._derniere = { label: court(ch?.label || r.choice, 40), rt: r.rt }; } }, () => { });
    return pr;
  };

};

  if (!note && !texte) return err('Choisissez une impression ou écrivez quelques mots.');
  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return err('Cette adresse e-mail ne semble pas valide.');
  const a = { id: uid(), date: Date.now(), note, type, texte, email: email || null, ...(UI.avisCtx || contexteAvis()), traite: false };
  const liste = Store.data.avis || (Store.data.avis = []);
  liste.unshift(a); if (liste.length > AVIS_MAX) liste.length = AVIS_MAX;
  Store.save(); modalAvisMerci(a);
}

/* ---------- côté praticienne : les avis donnés sur cet appareil (tests au centre) ---------- */
function blocAvisPraticien() {
  const liste = Store.data.avis || [], nouveaux = liste.filter(a => !a.traite).length;
  return `<details class="panel avis-prat"${UI.avisOuvert ? ' open' : ''}><summary><b>Avis des testeurs</b> <span class="pill">${liste.length ? `${nouveaux} nouveau${nouveaux > 1 ? 'x' : ''} · ${liste.length} au total` : 'aucun'}</span></summary>
    <p class="muted" style="font-size:.88rem;margin-top:8px">Avis donnés sur cet appareil (tests au centre). Ceux des testeurs à distance arrivent par e-mail à ${AVIS_EMAIL}.</p>
    ${liste.length ? `<div class="row" style="margin:10px 0"><button type="button" class="btn sm" data-act="avis-csv">Exporter en CSV</button><button type="button" class="btn sm ghost" data-act="avis">Ajouter un avis</button></div>
    <ul class="avis-liste">${liste.slice(0, 50).map(a => {
      const n = AVIS_NOTES.find(x => x[0] === a.note), t = AVIS_TYPES.find(x => x[0] === a.type);
      return `<li class="${a.traite ? 'traite' : ''}"><div class="avis-tete"><span class="emo" aria-hidden="true">${n ? n[1] : '💬'}</span><b>${esc(t ? t[1] : 'Avis')}</b><span class="muted">${esc(fmtDateH(a.date))}</span></div>
        <p class="avis-txt">${a.texte ? esc(a.texte) : '<span class="muted">(sans message)</span>'}</p>
        <p class="muted avis-meta">${esc(a.espace)} · ${esc(a.vue)} · ${esc(a.appareil)}${a.email ? ` · <a href="mailto:${esc(a.email)}">${esc(a.email)}</a>` : ''}</p>
        <div class="row"><button type="button" class="btn sm ghost" data-act="avis-traite" data-id="${a.id}">${a.traite ? 'Marquer comme nouveau' : 'Marquer comme traité'}</button><button type="button" class="btn sm ghost danger" data-act="avis-suppr" data-id="${a.id}" data-confirm="Supprimer cet avis ?">Supprimer</button></div></li>`;
    }).join('')}</ul>` : '<p class="muted" style="margin-top:8px">Aucun avis pour l’instant.</p>'}</details>`;
}
function csvAvis() {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  return ['date;note;sujet;message;espace;ecran;appareil;version;email;traite', ...(Store.data.avis || []).map(a => [q(fmtDateH(a.date)), a.note ?? '', q(AVIS_TYPES.find(x => x[0] === a.type)?.[1] || ''), q(a.texte), q(a.espace), q(a.vue), q(a.appareil), q(a.version), q(a.email), a.traite ? 'oui' : 'non'].join(';'))].join('\n');
}
const _vueListePatientsAvis = vueListePatients;
vueListePatients = function (...args) { return _vueListePatientsAvis(...args) + blocAvisPraticien(); };

/* ---------- le bouton, sur chaque écran ---------- */
const _renderAvis = render;
render = function (...args) {
  const r = _renderAvis(...args), main = $('#main');
  if (main && !main.querySelector('.avis-pied')) main.insertAdjacentHTML('beforeend', `<p class="avis-pied"><button type="button" class="btn sm ghost avis-btn" data-act="avis">${ICONE_AVIS}<span>Donner mon avis</span></button></p>`);
  return r;
};
const lienAvisJeu = (ex, r) => `<p class="avis-jeu"><button type="button" class="linkish" data-avis-ex="${ex.id}" data-avis-niv="${r?.niveau ?? ''}">${ICONE_AVIS}<span>Un souci avec ce jeu ? Donner mon avis</span></button></p>`;
// le plateau de jeu (#run) n’utilise pas le routeur data-act : écoute dédiée
document.addEventListener('click', e => { const b = e.target.closest('[data-avis-ex]'); if (b) { e.preventDefault(); modalAvis(b.dataset.avisEx, +b.dataset.avisNiv || null); } });
document.addEventListener('submit', e => { if (e.target.id === 'f-avis') { e.preventDefault(); enregistrerAvis(e.target); } });

Object.assign(ACTIONS_ELAN, {
  avis: () => modalAvis(),
  'avis-copier': el => { const a = (Store.data.avis || []).find(x => x.id === el.dataset.id); if (a) copier(texteAvis(a), 'Texte copié', '#avis-apercu'); },
  'avis-traite': el => { const a = (Store.data.avis || []).find(x => x.id === el.dataset.id); if (!a) return; a.traite = !a.traite; UI.avisOuvert = true; Store.save(); render(); },
  'avis-suppr': el => { Store.data.avis = (Store.data.avis || []).filter(x => x.id !== el.dataset.id); UI.avisOuvert = true; Store.save(); render(); toast('Avis supprimé'); },
  'avis-csv': () => offrirFichier(`avis-elan-${dk(Date.now())}.csv`, csvAvis()),
});


function demarrer() { Voice.init(); Store.load(); migrerElan(Store.data); installerEvenements(); installerEvenementsElan(); UI.vue = 'aujourdhui'; render(); }
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer); else demarrer();

</script>
<script src="elan-v09.js"></script>
</body>
