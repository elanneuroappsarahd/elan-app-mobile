<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mémo PAP en classe</title><style>
@font-face{font-family:"Chillax";src:url("/elan/fonts/chillax-500.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Chillax";src:url("/elan/fonts/chillax-600.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Hanken Grotesk";src:url("/elan/fonts/hanken-grotesk-400.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Hanken Grotesk";src:url("/elan/fonts/hanken-grotesk-500.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Hanken Grotesk";src:url("/elan/fonts/hanken-grotesk-600.woff2") format("woff2");font-weight:600;font-display:swap}
body{margin:0}
a{color:#131212}a:hover{color:#000}
.h-noir:hover{background:#000000!important;color:#FFFFFF!important;border-color:#000000!important}
</style></head><body style="margin:0">
<!-- Maquette Élan · Enseignant · Mémo PAP en classe (téléphone) · 390×844 -->

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2EDEB; color: #131212; font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 16px; line-height: 1.45; display: flex; flex-direction: column; overflow: hidden">
  <header style="position: relative; overflow: hidden; flex: none; background: #4C6BB2; color: #FFFFFF; padding: 16px 20px 14px; display: flex; flex-direction: column; gap: 2px">
    <img src="/elan/images/anneau-creme.png" alt="" style="position: absolute; right: -80px; top: -70px; width: 190px; height: auto; pointer-events: none">
    <span style="position: relative; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase">Mémo PAP · CM1 A</span>
    <h1 style="position: relative; margin: 0; font: 600 28px Chillax, sans-serif; line-height: 1.15">Évaluation de jeudi</h1>
    <span style="position: relative; font-size: 15px">Mathématiques · L.M., Étoile, N.B., J.R.</span>
  </header>

  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 10px">
    <div role="group" aria-label="Moment" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid #131212; background: #FFFFFF">
      <button type="button" aria-pressed="false" class="h-noir" style="min-height: 44px; border: 0; background: transparent; font: 500 15px 'Hanken Grotesk', sans-serif; color: #131212; cursor: pointer">Cours</button>
      <button type="button" aria-pressed="true" style="min-height: 44px; border: 0; background: #131212; color: #FFFFFF; font: 600 15px 'Hanken Grotesk', sans-serif; cursor: pointer">Évaluation</button>
      <button type="button" aria-pressed="false" class="h-noir" style="min-height: 44px; border: 0; background: transparent; font: 500 15px 'Hanken Grotesk', sans-serif; color: #131212; cursor: pointer">Devoirs</button>
    </div>

    <div style="display: flex; align-items: center; gap: 12px">
      <span style="flex: 1; height: 6px; background: #DCD3CD; display: block"><span style="display: block; width: 31%; height: 100%; background: #4C6BB2"></span></span>
      <span style="font-size: 14px; font-weight: 600">5 sur 16 prêts</span>
    </div>

    <section style="background: #FFFFFF; display: flex; flex-direction: column">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px 6px">
        <h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #333333">Évaluations</h2>
        <span style="font-size: 13px; font-weight: 600">2 sur 7</span>
      </div>
      <label for="e1" style="display: flex; gap: 14px; align-items: flex-start; padding: 10px 16px; border-top: 1px solid #EFE9E5; cursor: pointer"><input id="e1" type="checkbox" checked style="width: 22px; height: 22px; margin: 1px 0 0; accent-color: #4C6BB2; flex: none"><span><span style="text-decoration: line-through; color: #333333">Temps majoré (tiers-temps) ou quantité réduite</span><br><small style="font-size: 13px; color: #333333">L.M., Étoile, N.B.</small></span></label>
      <label for="e2" style="display: flex; gap: 14px; align-items: flex-start; padding: 10px 16px; border-top: 1px solid #EFE9E5; cursor: pointer"><input id="e2" type="checkbox" style="width: 22px; height: 22px; margin: 1px 0 0; accent-color: #4C6BB2; flex: none"><span><b style="font-weight: 600">Évaluation fractionnée en plusieurs temps</b><br><small style="font-size: 13px; color: #333333">Étoile, N.B.</small></span></label>
      <label for="e3" style="display: flex; gap: 14px; align-items: flex-start; padding: 10px 16px; border-top: 1px solid #EFE9E5; cursor: pointer"><input id="e3" type="checkbox" style="width: 22px; height: 22px; margin: 1px 0 0; accent-color: #4C6BB2; flex: none"><span><b style="font-weight: 600">Raisonnement évalué plutôt que le calcul posé</b><br><small style="font-size: 13px; color: #333333">N.B.</small></span></label>
      <label for="e4" style="display: flex; gap: 14px; align-items: flex-start; padding: 10px 16px; border-top: 1px solid #EFE9E5; cursor: pointer"><input id="e4" type="checkbox" style="width: 22px; height: 22px; margin: 1px 0 0; accent-color: #4C6BB2; flex: none"><span><b style="font-weight: 600">Évaluation annoncée à l'avance, sans surprise</b><br><small style="font-size: 13px; color: #333333">J.R.</small></span></label>
      <button type="button" class="h-noir" style="min-height: 44px; border: 0; border-top: 1px solid #EFE9E5; background: transparent; font: 600 14px 'Hanken Grotesk', sans-serif; color: #131212; text-align: left; padding: 0 16px; cursor: pointer">Voir les 3 autres</button>
    </section>

    <button type="button" aria-expanded="false" class="h-noir" style="display: flex; align-items: center; gap: 14px; min-height: 54px; padding: 0 16px; border: 0; background: #FFFFFF; text-align: left; font-family: inherit; color: #131212; cursor: pointer">
      <span style="width: 26px; height: 26px; border-radius: 50%; background: #4C6BB2; display: grid; place-items: center; flex: none"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></span>
      <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.3"><b style="font-size: 15px">Supports et documents</b><small style="font-size: 13px; color: #333333">2 sur 2 prêts</small></span>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
    <button type="button" aria-expanded="false" class="h-noir" style="display: flex; align-items: center; gap: 14px; min-height: 54px; padding: 0 16px; border: 0; background: #FFFFFF; text-align: left; font-family: inherit; color: #131212; cursor: pointer">
      <span style="width: 26px; height: 26px; border-radius: 50%; border: 2px solid #4C6BB2; box-sizing: border-box; flex: none"></span>
      <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.3"><b style="font-size: 15px">Consignes et oral</b><small style="font-size: 13px; color: #333333">0 sur 4 prêts</small></span>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
    <button type="button" aria-expanded="false" class="h-noir" style="display: flex; align-items: center; gap: 14px; min-height: 54px; padding: 0 16px; border: 0; background: #FFFFFF; text-align: left; font-family: inherit; color: #131212; cursor: pointer">
      <span style="width: 26px; height: 26px; border-radius: 50%; border: 2px solid #4C6BB2; box-sizing: border-box; flex: none"></span>
      <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.3"><b style="font-size: 15px">Outils autorisés</b><small style="font-size: 13px; color: #333333">1 sur 3 prêt</small></span>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
  </div>

  <nav aria-label="Espace enseignant" style="flex: none; background: #FFFFFF; border-top: 1px solid #DCD3CD; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="Ens-Classe-mobile.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 2px 14px; text-decoration: none; color: #333333; font-size: 12px; font-weight: 500; border-top: 3px solid transparent">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M18 14a5 5 0 0 1 3.5 6"></path></svg>Ma classe
    </a>
    <a href="Ens-Memo-mobile.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 2px 14px; text-decoration: none; color: #2E4785; font-size: 12px; font-weight: 600; border-top: 3px solid #4C6BB2">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6v3H9z"></path><path d="M7 5.5H5V21h14V5.5h-2"></path><path d="M8.5 13l2.5 2.5 4.5-5"></path></svg>Mémo PAP
    </a>
    <a href="Ens-Adapter-mobile.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 2px 14px; text-decoration: none; color: #333333; font-size: 12px; font-weight: 500; border-top: 3px solid transparent">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"></path></svg>Adapter
    </a>
    <a href="Ens-Fiches.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 2px 14px; text-decoration: none; color: #333333; font-size: 12px; font-weight: 500; border-top: 3px solid transparent">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"></path><path d="M4 19V5"></path><path d="M8 7h7"></path></svg>Fiches
    </a>
  </nav>
</div>

</body></html>
